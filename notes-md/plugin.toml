id = "augussst/notes-md"
name = "Notes MD"
version = "1.0.0"
# 32: tooltips on rows and images (link chips, images). Also uses ui.markdown (21)
# and argv runAsync (24).
plugin_api = 32
author = "augussst"
license = "MIT"
dependencies = ["xdg-open"]
tags = ["productivity"]
icon = "notes"
description = "Markdown notes with an interactive preview: tasks, links, note links, quotes, code copy and images."

[[setting]]
key = "notes_dir"
type = "folder"
label_key = "settings.notes_dir.label"
description_key = "settings.notes_dir.description"
default = "$XDG_DOCUMENTS_DIR/Notes"

[[setting]]
key = "extension"
type = "string"
label_key = "settings.extension.label"
description_key = "settings.extension.description"
default = "md"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = "fill"
placement = "floating"
position = "center_right"

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "nt"
glyph = "notes"
include_in_global_search = false

[[widget]]
id = "notes"
entry = "notes.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "notes"
