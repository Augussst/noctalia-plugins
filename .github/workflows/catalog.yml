name: Update catalog

# Regenerates catalog.toml from the plugin manifests and commits it when it
# changed. Pushes made with GITHUB_TOKEN do not start new workflow runs, so
# the bot's own commit does not loop.
on:
  push:
    branches: [main]
    paths-ignore: [catalog.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: timestamps come from git log

      - name: Regenerate catalog.toml
        run: python3 tools/update_catalog.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- catalog.toml; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add catalog.toml
          git commit -m "chore: update plugin catalog"
          git push
